<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>panjiarui123 的个人主页</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; max-width: 400px; width: 100%; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; color: white; font-size: 36px; font-weight: bold; }
        h1 { font-size: 24px; margin-bottom: 8px; color: #222; }
        .subtitle { font-size: 14px; color: #888; margin-bottom: 24px; }
        p { font-size: 15px; color: #555; line-height: 1.6; margin-bottom: 30px; }
        .links a { display: block; background: #f0f2f5; padding: 12px; margin: 10px 0; border-radius: 8px; color: #333; text-decoration: none; font-weight: 500; transition: all 0.2s; }
        .links a:hover { background: #667eea; color: white; }
    </style>
</head>
<body>

<div class="card">
    <!-- 头像昵称首字母 -->
    <div class="avatar">P</div>
    <h1>panjiarui123</h1>
    <div class="subtitle">欢迎来到我的经典 HTML 个人空间</div>
    <p>🚀 正在探索前端开发与开源世界。这里是我的个人博客，未来将在这里分享技术点滴与生活日常！</p>
    
    <div class="links">
        <a href="https://github.com" target="_blank">🐙 我的 GitHub 主页</a>
        <a href="mailto:你的邮箱@example.com">📧 联系我</a>
    </div>
</div>

</body>
</html>
