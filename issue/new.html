<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>新建 Issue - calcv</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #24292f; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
    textarea { height: 200px; resize: vertical; }
    .hint { font-size: 12px; color: #57606a; margin-top: 4px; }
    .actions { display: flex; justify-content: flex-end; gap: 12px; align-items: center; }
    .btn-cancel { padding: 8px 16px; color: #57606a; text-decoration: none; }
    .btn-submit { background: #1f883d; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .btn-submit:disabled { background: #94d3a2; cursor: not-allowed; }
  </style>
</head>
<body>
  <h2>新建 Issue</h2>
  <form id="issueForm">
    <div class="form-group">
      <label for="token">GitHub Personal Access Token (首次填写会自动保存在本地浏览器)</label>
      <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx 或 github_pat_xxxx" required>
      <div class="hint">需要具备 panjiarui123/calcv 仓库的 Contents 读写权限，仅保存在你的浏览器 localStorage 中。</div>
    </div>
    <div class="form-group">
      <label for="title">标题</label>
      <input type="text" id="title" placeholder="请输入 Issue 标题" required>
    </div>
    <div class="form-group">
      <label for="content">详细描述</label>
      <textarea id="content" placeholder="请描述具体问题或需求..." required></textarea>
    </div>
    <div class="actions">
      <span id="statusText" style="font-size: 14px; color: #57606a;"></span>
      <a href="index.html" class="btn-cancel">取消</a>
      <button type="submit" class="btn-submit" id="submitBtn">提交并生成 HTML 文件</button>
    </div>
  </form>

  <script>
    const OWNER = 'panjiarui123';
    const REPO = 'calcv';
    const DIR = 'issue';

    const tokenInput = document.getElementById('token');
    tokenInput.value = localStorage.getItem('gh_issue_token') || '';

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag]));
    }

    function buildHTML(id, title, content, createdAt) {
      const safeTitle = escapeHTML(title);
      const safeContent = escapeHTML(content);
      return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>#${id} ${safeTitle}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #24292f; }
    .header { border-bottom: 1px solid #d0d7de; padding-bottom: 16px; margin-bottom: 24px; }
    .title { font-size: 28px; margin: 0 0 8px 0; }
    .issue-num { color: #57606a; font-weight: normal; }
    .meta { font-size: 14px; color: #57606a; }
    .badge { background: #1f883d; color: white; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-right: 8px; }
    .content { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; padding: 20px; line-height: 1.6; white-space: pre-wrap; }
    .back-link { display: inline-block; margin-top: 24px; color: #0969da; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">${safeTitle} <span class="issue-num">#${id}</span></h1>
    <div class="meta"><span class="badge">Open</span>创建于 ${createdAt}</div>
  </div>
  <div class="content">${safeContent}</div>
  <a href="index.html" class="back-link">← 返回 Issue 列表</a>
</body>
</html>`;
    }

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binString = '';
      for (let i = 0; i < bytes.length; i++) {
        binString += String.fromCharCode(bytes[i]);
      }
      return btoa(binString);
    }

    document.getElementById('issueForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = tokenInput.value.trim();
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value;
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusText');

      localStorage.setItem('gh_issue_token', token);
      btn.disabled = true;
      status.textContent = '正在计算编号...';

      try {
        const listRes = await fetch(`https://github.com{OWNER}/${REPO}/contents/${DIR}?t=${Date.now()}`, {
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json'
          }
        });
        if (!listRes.ok) {
          throw new Error(`获取文件列表失败 (HTTP ${listRes.status})，请检查 Token 权限`);
        }

        const files = await listRes.json();
        const existingIds = Array.isArray(files)
          ? files.filter(f => /^#\d+\.html$/.test(f.name)).map(f => parseInt(f.name.slice(1)))
          : [];
        const nextId = existingIds.length > 0 ? Math.max(...existingIds) + 1 : 1;
        const fileName = `#${nextId}.html`;

        status.textContent = `正在创建 ${fileName}...`;
        const htmlContent = buildHTML(nextId, title, content, new Date().toLocaleString('zh-CN'));

        const putRes = await fetch(`https://github.com{OWNER}/${REPO}/contents/${DIR}/${encodeURIComponent(fileName)}`, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Create issue ${DIR}/${fileName}`,
            content: utf8ToBase64(htmlContent)
          })
        });

        if (!putRes.ok) {
          const errData = await putRes.json();
          throw new Error(`提交失败: ${errData.message || putRes.status}`);
        }

        status.textContent = '创建成功！正在等待 GitHub Pages 部署新页面（约 20 秒）...';
        setTimeout(() => {
          window.location.href = encodeURIComponent(fileName);
        }, 20000);

      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        status.textContent = '';
      }
    });
  </script>
</body>
</html>
