<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建新 Issue 并生成 HTML</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #24292f; }
        h2 { border-bottom: 1px solid #d8dee4; padding-bottom: 16px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input[type="text"], textarea { width: 100%; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        textarea { height: 200px; resize: vertical; }
        .actions { display: flex; gap: 12px; }
        .btn-submit { background-color: #2da44e; color: white; border: 1px solid rgba(27,31,36,0.15); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .btn-cancel { background-color: #f6f8fa; color: #24292f; border: 1px solid #d0d7de; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; }
        .tip { background-color: #ddf4ff; border: 1px solid #54aeff; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; color: #0969da; }
    </style>
</head>
<body>

    <h2>创建新 Issue</h2>
    <div class="tip">💡 提示：点击提交后，浏览器会自动为您下载一个对应的独立 HTML 物理文件。请将其放入您的仓库中提交至 GitHub Pages。</div>

    <form id="issue-form">
        <div class="form-group">
            <label for="title">Issue 标题</label>
            <input type="text" id="title" required placeholder="请输入标题">
        </div>
        <div class="form-group">
            <label for="content">详细内容</label>
            <textarea id="content" required placeholder="请输入 Issue 的详细描述内容..."></textarea>
        </div>
        <div class="actions">
            <button type="submit" class="btn-submit">生成并下载 HTML 页面</button>
            <a href="index.html" class="btn-cancel">取消</a>
        </div>
    </form>

    <script>
        document.getElementById('issue-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            // 1. 计算当前的递增 ID
            let issues = JSON.parse(localStorage.getItem('download_issues')) || [];
            const nextId = issues.length > 0 ? Math.max(...issues.map(i => i.id)) + 1 : 1;
            const dateStr = new Date().toLocaleString('zh-CN', { hour12: false });

            // 2. 核心：构建即将生成的独立 HTML 文件的完整源代码
            const fileTemplate = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title} · Issue #${nextId}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #24292f; }
        .issue-header { border-bottom: 1px solid #d8dee4; padding-bottom: 16px; margin-bottom: 20px; }
        .issue-title { font-size: 32px; font-weight: 400; margin: 0 0 8px 0; }
        .issue-id { color: #57606a; font-weight: 300; }
        .meta-badge { display: inline-block; background-color: #2da44e; color: white; padding: 4px 12px; border-radius: 2em; font-size: 14px; font-weight: 500; margin-right: 8px; }
        .meta-text { color: #57606a; font-size: 14px; }
        .content-container { display: flex; gap: 16px; margin-top: 20px; }
        .avatar { width: 40px; height: 40px; background-color: #21262d; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; }
        .comment-box { flex: 1; border: 1px solid #d0d7de; border-radius: 6px; overflow: hidden; }
        .comment-header { background-color: #f6f8fa; padding: 8px 16px; border-bottom: 1px solid #d0d7de; font-size: 12px; color: #57606a; }
        .comment-body { padding: 16px; background-color: #fff; min-height: 120px; white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
        .nav-back { display: inline-block; margin-top: 24px; color: #0969da; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="issue-header">
        <h1 class="issue-title">${title} <span class="issue-id">#${nextId}</span></h1>
        <div>
            <span class="meta-badge">Open</span>
            <span class="meta-text">系统于 ${dateStr} 静态生成了此页面</span>
        </div>
    </div>
    <div class="content-container">
        <div class="avatar">I</div>
        <div class="comment-box">
            <div class="comment-header"><strong>Issue Creator</strong> 发布了此独立文件</div>
            <div class="comment-body">${content.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
        </div>
    </div>
    <a href="index.html" class="nav-back">← 返回主列表</a>
</body>
</html>`;

            // 3. 触发浏览器物理下载文件
            const blob = new Blob([fileTemplate], { type: "text/html;charset=utf-8" });
            const downloadLink = document.createElement("a");
            downloadLink.href = URL.createObjectURL(blob);
            // 设定物理文件名（支持带特异字符，如 #1.html 或者是递增的 1.html）
            downloadLink.download = `${nextId}.html`; 
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);

            // 4. 将目录元数据存入索引库中供首页跳转
            issues.push({ id: nextId, title: title, date: dateStr });
            localStorage.setItem('download_issues', JSON.stringify(issues));

            // 5. 提示并返回首页
            alert(`已成功生成并下载 ${nextId}.html！请将它和更新后的项目一起上传至 GitHub。`);
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
