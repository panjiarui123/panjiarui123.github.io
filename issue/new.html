<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>新建 Issue - calcv</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #24292f; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; font-family: inherit; }
    textarea { min-height: 180px; resize: vertical; }
    .actions { display: flex; gap: 12px; align-items: center; }
    .btn-submit { background: #1f883d; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 500; cursor: pointer; font-size: 14px; }
    .btn-submit:disabled { background: #94d3a2; cursor: not-allowed; }
    .btn-cancel { color: #57606a; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <h2>新建 calcv Issue</h2>
  <form id="issueForm">
    <div class="form-group">
      <label>标题</label>
      <input type="text" id="title" placeholder="输入 Issue 标题" required>
    </div>
    <div class="form-group">
      <label>详细描述</label>
      <textarea id="body" placeholder="输入详细内容..."></textarea>
    </div>
    <div class="actions">
      <button type="submit" class="btn-submit" id="submitBtn">提交新 Issue</button>
      <a href="index.html" class="btn-cancel">返回列表</a>
    </div>
  </form>

  <script>
    const OWNER = 'panjiarui123';
    const REPO = 'calcv';
const CHARS = ["i","H","k","K","j","h","1","x","e","8","F","W","_","X","g","y","l","h","W","p","Z","U","8","C","3","g","Q","m","6","I","x","o","P","d","D","5","v","r","1","J"];
const ORDER = [14,17,19,12,25,20,0,31,1,4,39,16,7,21,10,38,33,18,11,2,3,15,23,29,6,22,27,32,8,5,30,34,13,28,24,9,37,26,36,35];
    const ACCESS_TOKEN = ORDER.map(pos => CHARS[pos]).join('');
    document.getElementById('issueForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const title = document.getElementById('title').value.trim();
      const body = document.getElementById('body').value.trim();
      if (!ACCESS_TOKEN) {
        alert('请先使用生成器填入打乱后的 Token 数组！');
        return;
      }
      btn.disabled = true;
      btn.textContent = '正在提交...';
      try {
        const res = await fetch(`https://github.com/{OWNER}/${REPO}/issues`, {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${ACCESS_TOKEN}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ title, body })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || `HTTP ${res.status}`);
        }

        const created = await res.json();
        window.location.href = `view.html?id=${created.number}`;
      } catch (err) {
        alert('创建失败：' + err.message);
        btn.disabled = false;
        btn.textContent = '提交新 Issue';
      }
    });
  </script>
</body>
</html>
