<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Issues 列表 - calcv</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #24292f; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-new { background: #1f883d; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 500; }
    .btn-new:hover { background: #1a7f37; }
    .issue-list { border: 1px solid #d0d7de; border-radius: 6px; list-style: none; padding: 0; margin: 0; }
    .issue-item { padding: 16px; border-bottom: 1px solid #d0d7de; display: flex; justify-content: space-between; align-items: center; }
    .issue-item:last-child { border-bottom: none; }
    .issue-item:hover { background: #f6f8fa; }
    .issue-link { font-size: 16px; font-weight: 600; color: #24292f; text-decoration: none; }
    .issue-link:hover { color: #0969da; }
    .issue-meta { color: #57606a; font-size: 13px; margin-top: 4px; }
    .badge-open { background: #1f883d; color: white; font-size: 12px; padding: 2px 8px; border-radius: 12px; }
    .empty { padding: 40px; text-align: center; color: #57606a; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h2>calcv Issues</h2>
    <a href="new.html" class="btn-new">New Issue</a>
  </div>
  <ul class="issue-list" id="issueList">
    <li class="empty">正在从 GitHub 加载 calcv 的 Issues...</li>
  </ul>

  <script>
    const OWNER = 'panjiarui123';
    const REPO = 'calcv';

    async function loadIssues() {
      const listEl = document.getElementById('issueList');
      try {
        // 调用 GitHub 原生 Issues API
        const res = await fetch(`https://github.com/{OWNER}/${REPO}/issues?state=open&t=${Date.now()}`);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json();
        // 过滤掉 Pull Request，只保留纯 Issue
        const issues = data.filter(item => !item.pull_request);

        if (issues.length === 0) {
          listEl.innerHTML = '<li class="empty">暂无 Open 状态的 Issue，点击右上角创建一个吧！</li>';
          return;
        }

        listEl.innerHTML = issues.map(issue => `
          <li class="issue-item">
            <div>
              <a class="issue-link" href="view.html?id=${issue.number}">${issue.title}</a>
              <div class="issue-meta">#${issue.number} 由 ${issue.user.login} 创建于 ${new Date(issue.created_at).toLocaleDateString('zh-CN')}</div>
            </div>
            <span class="badge-open">${issue.state}</span>
          </li>
        `).join('');
      } catch (err) {
        listEl.innerHTML = `<li class="empty">加载失败 (${err.message})，请检查网络或确认 calcv 仓库为 Public。</li>`;
      }
    }

    loadIssues();
  </script>
</body>
</html>
