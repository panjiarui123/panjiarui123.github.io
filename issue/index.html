<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Issues 列表 - calcv</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #24292f; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-new { background: #1f883d; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 500; }
    .btn-new:hover { background: #1a7f37; }
    .issue-list { border: 1px solid #d0d7de; border-radius: 6px; list-style: none; padding: 0; margin: 0; }
    .issue-item { padding: 16px; border-bottom: 1px solid #d0d7de; display: flex; justify-content: space-between; align-items: center; }
    .issue-item:last-child { border-bottom: none; }
    .issue-item:hover { background: #f6f8fa; }
    .issue-link { font-size: 16px; font-weight: 600; color: #24292f; text-decoration: none; }
    .issue-link:hover { color: #0969da; }
    .issue-meta { color: #57606a; font-size: 13px; }
    .empty { padding: 40px; text-align: center; color: #57606a; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h2>Issues</h2>
    <a href="new.html" class="btn-new">New Issue</a>
  </div>
  <ul class="issue-list" id="issueList">
    <li class="empty">正在从 GitHub 仓库加载列表...</li>
  </ul>

  <script>
    const OWNER = 'panjiarui123';
    const REPO = 'calcv';
    const DIR = 'issue';

    async function loadIssues() {
      const listEl = document.getElementById('issueList');
      try {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}?t=${Date.now()}`);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const files = await res.json();

        const issueFiles = files
          .filter(f => /^#\d+\.html$/.test(f.name))
          .sort((a, b) => parseInt(b.name.slice(1), 10) - parseInt(a.name.slice(1), 10));

        if (issueFiles.length === 0) {
          listEl.innerHTML = '<li class="empty">暂无 Issue，点击右上角创建一个吧！</li>';
          return;
        }

        const itemsHtml = await Promise.all(issueFiles.map(async (file) => {
          const encodedHref = encodeURIComponent(file.name);
          let displayTitle = file.name;

          try {
            // 直接从 download_url 拉取最新文件内容，不受 GitHub Pages 缓存延迟影响
            const pageRes = await fetch(`${file.download_url}?t=${Date.now()}`);
            const htmlText = await pageRes.text();
            const titleMatch = htmlText.match(/<title>(.*?)<\/title>/i);
            if (titleMatch && titleMatch[1]) {
              displayTitle = titleMatch[1];
            }
          } catch (e) {
            console.warn('获取标题失败:', file.name, e);
          }

          return `
            <li class="issue-item">
              <a class="issue-link" href="${encodedHref}">${displayTitle}</a>
              <span class="issue-meta">${file.name}</span>
            </li>
          `;
        }));

        listEl.innerHTML = itemsHtml.join('');
      } catch (err) {
        listEl.innerHTML = `<li class="empty">加载失败 (${err.message})，请确保仓库为 Public 且存在 ${DIR} 文件夹。</li>`;
      }
    }

    loadIssues();
  </script>
</body>
</html>
